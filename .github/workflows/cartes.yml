name: Cartes du profil

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - ".github/workflows/cartes.yml"

permissions:
  contents: write

concurrency:
  group: cartes-du-profil
  cancel-in-progress: true

jobs:
  cartes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "fonttools[woff]==4.60.2"
      - name: Contributions des 12 derniers mois
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Cartes SVG
        run: python scripts/render_cards.py
      - name: Commit si les cartes ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "Rien de neuf"
          else
            git commit -m "chore: cartes du profil régénérées"
            git push
          fi
